[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medcl-cornerstone"
version = "0.2.0"
description = "Read-only Cornerstone3D viewer for the local MedCL app"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.63,<2"]

[tool.setuptools]
packages = ["medcl_cornerstone"]
package-dir = {medcl_cornerstone = "."}
include-package-data = true

[tool.setuptools.package-data]
medcl_cornerstone = ["frontend/build/*", "frontend/build/assets/*"]

[[tool.streamlit.component.components]]
name = "viewer"
asset_dir = "frontend/build"
